# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: it
timezone: Europe/Rome

title: Fabio Dotto
tagline: Note, letture, ricerca
description: >-
  Note di lettura, ricerca accademica e riflessioni sul rapporto tra
  cognizione, religione e scienze cognitive. Blog di Fabio Dotto.

# Fill in the protocol & hostname for your site.
# E.g. 'https://username.github.io', note that it does not end with a '/'.
url: "https://www.fabiodotto.it"
baseurl: ""

github:
  username: fdotto

social:
  name: Fabio Dotto
  email: dotto.fabio@gmail.com
  links:
    - https://github.com/fdotto

# Prefer color scheme setting.
# Available options: light | dark  (empty = follows system preference)
theme_mode: # [light | dark]

# The CDN endpoint for media resources.
cdn:

# The avatar on sidebar, support local or CORS resources
avatar: /assets/img/avatar.jpg

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
social_preview_image: /assets/img/avatar.jpg

# Boolean type, the global switch for TOC in posts.
toc: true

comments:
  provider: # [disqus | utterances | giscus]

# Self-hosted static assets, optional
assets:
  self_host:
    enabled: # boolean, keep empty means false
    env: # [development | production]

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:
      # - "/example"

paginate: 10

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
